[project]
name = "newsletter-summary"
version = "0.1.0"
description = "Summarize Gmail-labeled newsletters into a local RSS feed."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]==3.3.6",
  "beautifulsoup4>=4.12.3",
  "google-api-python-client>=2.154.0",
  "google-auth>=2.36.0",
  "html2text>=2024.2.26",
  "pyyaml>=6.0.2",
  "requests>=2.32.3",
  "nh3>=0.3.8",
  "cryptography>=48.0.0",
  "readability-lxml>=0.9",
]

[project.scripts]
newsletter-summary = "newsletter_summary.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.18",
    "ty>=0.0.50",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Defaults (E4/E7/E9, F) plus import hygiene, bugbears, comprehensions, and
# modern-syntax checks.
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "UP", "RUF"]
ignore = [
  # Long string literals in prompts and generated HTML are clearer unwrapped.
  "E501",
]

